<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="theme-color" content="#1F4E9C">
<title>Parla! Italian</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* Baloo 2 (SIL Open Font License), self-hosted so the app looks right offline */
@font-face{font-family:"Baloo 2";font-weight:500 800;font-display:swap;src:url(./fonts/baloo2-latin.woff2) format("woff2")}
:root{
  --blue:#1F4E9C; --blue-dk:#163a75; --sky:#E8F0FB; --lemon:#F6D33C; --lemon-dk:#d4b120;
  --basil:#2E8B57; --basil-dk:#226a42; --tomato:#D7362B; --tomato-dk:#a8281f;
  --ink:#1B2340; --mute:#5b6683; --white:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sky);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;font-size:18px;line-height:1.35}
body{min-height:100dvh}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
h1,h2,p{margin:0}

/* chunky game buttons */
.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;font-weight:800;font-size:1.1rem;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-dk);transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-dk)}
.btn.go{background:var(--basil);box-shadow:0 5px 0 var(--basil-dk)}
.btn.no{background:var(--tomato);box-shadow:0 5px 0 var(--tomato-dk)}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:0 5px 0 #c9d6ec}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:1.15rem}
.brand{font-size:1.9rem;color:var(--blue);letter-spacing:-.5px}
.stats{display:flex;gap:14px}
.goal{height:12px;background:#fff;border-radius:99px;overflow:hidden;margin:10px 0 2px;box-shadow:inset 0 0 0 2px #d6e1f3}
.goal>i{display:block;height:100%;background:var(--lemon);border-radius:99px;transition:width .4s}
.small{font-size:.9rem;color:var(--mute)}
.start{margin:18px 0 22px}
.start .btn{padding:22px;font-size:1.5rem}
.start .small{text-align:center;margin-top:10px}
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;text-align:left;box-shadow:0 4px 0 #c9d6ec}
.unit:active{transform:translateY(3px);box-shadow:0 1px 0 #c9d6ec}
.unit .ic{font-size:2rem;width:48px;height:48px;display:grid;place-items:center;background:var(--sky);border-radius:14px;flex:none}
.unit .nm{font-weight:800}
.unit .bar{height:8px;background:var(--sky);border-radius:99px;overflow:hidden;margin-top:4px}
.unit .bar>i{display:block;height:100%;background:var(--basil)}
.unit .ct{font-size:.85rem;color:var(--mute);flex:none}
.link{background:none;color:var(--blue);font-weight:800;text-decoration:underline;padding:16px 0;text-align:center;width:100%}

/* lesson */
.lbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.x{background:none;font-size:1.6rem;color:var(--mute);padding:0 4px}
.prog{flex:1;height:16px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px #d6e1f3}
.prog>i{display:block;height:100%;background:var(--basil);border-radius:99px;transition:width .3s}
.combo{font-weight:800;color:var(--tomato);min-width:44px;text-align:right}
.ask{font-weight:800;font-size:1.3rem;margin-bottom:12px}
.body{flex:1;display:flex;flex-direction:column;gap:14px}

/* the maiolica tile: the one decorative object in the app */
.tile{align-self:center;width:min(62vw,230px);aspect-ratio:1;border-radius:20px;background:
  radial-gradient(circle at 12% 12%,var(--blue) 0 7px,transparent 8px),
  radial-gradient(circle at 88% 12%,var(--blue) 0 7px,transparent 8px),
  radial-gradient(circle at 12% 88%,var(--blue) 0 7px,transparent 8px),
  radial-gradient(circle at 88% 88%,var(--blue) 0 7px,transparent 8px),#fff;
  border:9px solid var(--blue);box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 9px var(--lemon),0 6px 0 var(--blue-dk);
  display:grid;place-items:center;font-size:clamp(64px,24vw,104px);line-height:1}
.tile.sm{width:min(40vw,150px);font-size:clamp(48px,16vw,70px);border-width:7px}
.it{font-size:1.9rem;font-weight:800;color:var(--blue);text-align:center;line-height:1.15}
.pron{text-align:center;color:var(--mute);font-size:1rem}
.en{text-align:center;font-size:1.15rem}
.speak{display:flex;gap:10px;justify-content:center}
.circ{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;font-size:1.7rem;box-shadow:0 5px 0 var(--blue-dk);flex:none}
.circ.lem{background:var(--lemon);box-shadow:0 5px 0 var(--lemon-dk)}
.circ.mic{background:var(--tomato);box-shadow:0 5px 0 var(--tomato-dk)}
.circ.big{width:110px;height:110px;font-size:3rem}
.circ:active{transform:translateY(4px);box-shadow:none}
.circ.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.heard{text-align:center;min-height:1.4em;font-size:1rem}
.heard b{color:var(--blue)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border-radius:16px;padding:14px 16px;text-align:left;font-weight:700;box-shadow:0 4px 0 #c9d6ec;font-size:1.05rem}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #c9d6ec}
.opt.right{background:#d8f2e2;box-shadow:0 4px 0 var(--basil)}
.opt.wrong{background:#fadcd9;box-shadow:0 4px 0 var(--tomato)}
.foot{margin-top:16px}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;padding:18px 16px max(18px,env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet>div{max-width:488px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sheet.ok{background:#d8f2e2;color:var(--basil-dk)}
.sheet.bad{background:#fadcd9;color:var(--tomato-dk)}
.sheet h2{font-size:1.5rem}
.sheet .ans{font-weight:800;font-size:1.2rem;color:var(--ink)}
@keyframes up{from{transform:translateY(100%)}}

/* finish */
.done{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.done h1{font-size:2.6rem;color:var(--blue);line-height:1}
.cards3{display:flex;gap:10px}
.cards3>div{flex:1;background:#fff;border-radius:16px;padding:12px 6px;box-shadow:0 4px 0 #c9d6ec;font-weight:800;font-size:1.4rem}
.cards3 small{display:block;font-size:.8rem;color:var(--mute);font-weight:500}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* phrasebook */
.pb h2{margin:18px 0 8px;font-size:1.2rem}
.pbrow{display:flex;gap:12px;align-items:center;width:100%;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;text-align:left;box-shadow:0 3px 0 #c9d6ec}
.pbrow .e{font-size:1.7rem;flex:none}
.pbrow .t{font-weight:800;color:var(--blue)}
.pbrow .s{font-size:.9rem;color:var(--mute)}
.search{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid #c9d6ec;margin:12px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
